[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-screener"
version = "1.0.0"
description = "LLM-based resume screening system with explainable, ranked candidate matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
resume-screener = "resume_screener.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
